name: claude review

# On demand rather than on every push, to limit CI runtime and cost: add the
# `gate` label to a pull request to request a review, and remove and re-add it
# after a push to request another.
on:
  pull_request:
    types: [labeled]

jobs:
  review:
    if: github.event.label.name == 'gate'
    # Callers must grant explicitly: org default token permissions are
    # read-only, and a called workflow can't exceed its caller's grant.
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    uses: konyklabs/.github/.github/workflows/claude-review.yml@main
    secrets: inherit
